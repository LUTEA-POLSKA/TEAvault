[package]
name = "teavault-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Command-line client for TEAvault. Goes through the same checks as the GUI."

[[bin]]
name = "teavault"
path = "src/main.rs"

[dependencies]
teavault-core.workspace = true
teavault-daemon = { path = "../teavault-daemon" }
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
] }