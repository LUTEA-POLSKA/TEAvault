[package]
name = "teavault-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "TEAvault background process: tray, event-driven named-pipe server, conditional clipboard clearing."

[lib]
name = "teavault_daemon"
path = "src/lib.rs"

[[bin]]
name = "teavaultd"
path = "src/main.rs"

[[bin]]
name = "teavault-bench"
path = "src/bin/teavault-bench.rs"

[dependencies]
teavault-core.workspace = true
serde_json.workspace = true

[dev-dependencies]
teavault-core.workspace = true
tempfile.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_DataExchange",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    # WNDCLASSW carries HICON/HBRUSH/HGDIOBJ, so the struct is only generated
    # when the GDI features are on.
    "Win32_Graphics_Gdi",
] }